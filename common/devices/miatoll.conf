# Redmi Note 9S / 9 Pro / 9 Pro Max, Redmi Note 10 Lite, POCO M2 Pro -- Mu-Silicium's miatollPkg.
# The framebuffer, the CPU, the USB link and the touch screen (Huaxing panel); the kernel's other phone drivers
# are written for redwood and are not started here (see docs/PORTING.md, "miatoll").
NAME="Redmi Note 9S / 9 Pro / POCO M2 Pro (miatoll)"
KIND=phone
SOC="Qualcomm Snapdragon 720G (SM7125)"

# Mu-Silicium builds miatoll per model only for the SMBIOS names (build_uefi.py -d miatoll -m N:
# 0 curtana Note 9S, 1 curtana Note 9 Pro India, 2 curtana Note 10 Lite, 3 joyeuse, 4 excalibur, 5 gram)
UEFI_TARGET=miatoll
# Mu-Silicium 3.6 (uefi/miatoll/apply.sh): later releases do not boot on these phones (Mi logo, a reset, again),
# and nothing built with clang 23 does -- build it with clang 18 (uefi/README.md)
MU_SILICIUM=Mu-Silicium-3.6
UEFI_FD=
DTB=                            # empty: Mu-Silicium/Resources/DTBs/miatoll.dtb
FD_BASE=0x9FD00000              # miatoll.toml and miatollPkg's memory map
FD_SIZE=0x200000
PAYLOAD_BASE=0xB0000000         # "XNU Payload" in miatollPkg's memory map; not redwood's 0xF0000000 (xnuloader/loader.c)

# The kernel built here (xnu-build.sh) takes the virtual timer's interrupt from the loader (19 on SM7125, where
# prebuilt/'s waits for 27, SM7325's, and hangs). Without a kernel toolchain: KERNEL=out/mach.miatoll, made
# from the prebuilt one by tools/patch-kernel-miatoll.py (it has no touch driver).
KERNEL=
FB_BASE=0x9C000000              # 1080 x 2400, "Display Reserved"; xnuloader picks platform_miatoll by it
WIFI_ATH11K=0                   # WCN3990 (ath10k), not a WCN6750

# bootcpu=7: an A76 (cores 6-7 are the big ones here too), the loader keeps watching from core 0.
# Nothing that starts a redwood driver: the loader drops touchscreen=, cpufreq= and the like
# (redwood_driver_args in xnuloader/loader.c), the kernel itself refuses gpu=1, wifi=1 and adsp=1.
BOOTARGS="-v bootcpu=7 cpus=8 ft8756=1"   # ft8756=1: the touch screen (tools/mk-fw-touch-miatoll.sh first)
DEFAULT_SECS=900
# no touch driver yet: the demo job swipes the lock screen away by itself
USERLAND_VARS="RC_JOBS=rc.jobs.unlock SLIM=slim.miatoll"   # SLIM: a system image that fits 4 GB (userland/slim.miatoll)
FIRMWARE=""
